{% extends "base.html" %}
{% block title %}Gomoku — Five in a Row{% endblock %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center py-12 px-4">
  <h1 class="text-4xl font-bold text-gray-900 mb-8">Gomoku</h1>
  <div
    data-island="gomoku"
    class="bg-white rounded-xl shadow-lg p-8"
  >
    <noscript>
      <p class="text-gray-600">JavaScript is required to play.</p>
    </noscript>
    <div class="animate-pulse text-gray-400 text-center">Loading game…</div>
  </div>
  <div class="mt-8 flex gap-4 text-sm">
    <a href="/" class="text-blue-600 hover:underline">← Back to Hello</a>
    <a href="/tictactoe" class="text-blue-600 hover:underline">Play Tic-Tac-Toe →</a>
  </div>
</div>
{% endblock %}
